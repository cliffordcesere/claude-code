<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Youmi Wings — direction A « Vendredi »</title>
<!--
  Direction A — « Vendredi ». Le rendez-vous de la semaine est l'idée : le jour en très grand,
  le plat en pleine largeur juste dessous, puis l'offre et les infos. Brun laqué (la sauce),
  crème, un seul accent or (les bananes pesées). Grotesque très condensée + grotesque de texte.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Hanken+Grotesk:wght@500;600&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #170D08;          /* brun laqué très sombre */
    --cream: #F5E9D8;
    --gold: #F2B640;        /* accent : < 10 % de la surface */
    --muted: #B39C86;
    --rule: rgba(245, 233, 216, .22);
    --display: "Big Shoulders Display", sans-serif;
    --text: "Hanken Grotesk", sans-serif;
    --m: 72px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); overflow: clip; }
  body { display: grid; place-items: center; min-height: 100vh; }
  body.render { place-items: start; }

  .stage {
    position: relative; overflow: hidden; width: 1080px; height: 1920px;
    background: var(--bg); color: var(--cream); font-family: var(--text);
    transform-origin: center; -webkit-font-smoothing: antialiased;
  }
  .render .stage { transform: none !important; }

  .brand { position: absolute; left: var(--m); top: 262px; font-weight: 600; font-size: 40px; letter-spacing: -.01em; }

  .day { position: absolute; left: var(--m); right: var(--m); top: 330px; }
  .day .pre { display: block; font-weight: 500; font-size: 46px; color: var(--gold); margin-bottom: 4px; }
  .day .big {
    display: inline-block; font-family: var(--display); font-weight: 900; text-transform: uppercase;
    line-height: .8; letter-spacing: -.005em; white-space: nowrap;
  }
  .mask { display: block; overflow: hidden; }
  .line { display: block; }

  .photo {
    position: absolute; left: 0; top: 664px; width: 1080px; height: 640px; overflow: hidden;
  }
  .photo img { display: block; width: 100%; height: 100%; object-fit: cover; }

  .offers {
    position: absolute; left: var(--m); right: var(--m); top: 1340px;
    display: grid; grid-template-columns: 1.25fr 1fr; gap: 0 48px;
  }
  .offers dt { font-weight: 500; font-size: 30px; color: var(--gold); margin-bottom: 6px; }
  .offers dd { display: flex; align-items: baseline; gap: 14px; font-family: var(--display); font-weight: 800; font-size: 78px; line-height: .92; text-transform: uppercase; white-space: nowrap; }
  .offers dd small { font-family: var(--text); font-weight: 500; font-size: 30px; text-transform: none; color: var(--muted); }

  .info {
    position: absolute; left: var(--m); right: var(--m); top: 1474px; padding-top: 20px;
    border-top: 1px solid var(--rule);
    display: grid; grid-template-columns: .95fr .7fr 1.35fr; gap: 0 32px;
    font-weight: 500; font-size: 28px; line-height: 1.3; font-variant-numeric: tabular-nums;
  }
  .info span { color: var(--muted); display: block; }

  canvas.grain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: overlay; opacity: .07; }

  .guides { position: absolute; inset: 0; pointer-events: none; display: none; }
  .show-guides .guides { display: block; }
  .guides i { position: absolute; left: 0; right: 0; background: rgba(255,0,80,.18); }
  .guides i.top { top: 0; height: 250px; } .guides i.bottom { bottom: 0; height: 340px; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <p class="brand">Youmi Wings</p>

  <h1 class="day">
    <span class="pre">Chaque</span>
    <span class="mask"><span class="line big" id="fit">Vendredi</span></span>
  </h1>

  <div class="photo"><img src="assets/plat.jpg" alt="Barquette de wings laqués, bananes pesées, salade de chou et sauce"></div>

  <dl class="offers">
    <div><dt>Spécial bière</dt><dd>5 pour 1&nbsp;000 <small>gourdes</small></dd></div>
    <div><dt>Wings</dt><dd>dès 750 <small>gourdes</small></dd></div>
  </dl>

  <div class="info">
    <p><span>Adresse</span>Delmas 75, Siloe M</p>
    <p><span>Livraison</span>Disponible</p>
    <p><span>Téléphone</span>3179 3416 / 4943 2244</p>
  </div>

  <canvas class="grain" id="grain" aria-hidden="true"></canvas>
  <div class="guides"><i class="top"></i><i class="bottom"></i></div>
</div>

<script>
window.__config = { width: 1080, height: 1920, fps: 30, duration: 1, still: 0, fonts: ["Big Shoulders Display", "Hanken Grotesk"] };
</script>
<script src="engine.js"></script>
<script>
/* « Vendredi » occupe exactement la largeur de la grille, quelle que soit la fonte chargée. */
window.onSeek(() => {
  const el = document.getElementById("fit");
  if (el.dataset.fitted === document.fonts.status) return;
  const target = 1080 - 2 * 72;
  el.style.fontSize = "100px";
  el.style.fontSize = (100 * target / el.getBoundingClientRect().width) + "px";
  el.dataset.fitted = document.fonts.status;
});
</script>
</body>
</html>
