<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Youmi Wings — direction B « Carte »</title>
<!--
  Direction B — « Carte ». Le flyer se lit comme la carte d'une bonne adresse : le nom en grand
  serif, le plat cadré comme une photo de magazine, puis les infos alignées comme des lignes de
  menu (intitulé à gauche, valeur à droite). Papier crème, encre brune, un accent rouge piment.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@500;600&display=block" rel="stylesheet">
<style>
  :root {
    --paper: #F0E6D6;
    --ink: #1D140E;
    --red: #B4301C;         /* piment : accent < 10 % */
    --muted: #7A6A5C;
    --rule: rgba(29, 20, 14, .2);
    --serif: "Gloock", serif;
    --text: "Hanken Grotesk", sans-serif;
    --m: 72px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); overflow: clip; }
  body { display: grid; place-items: center; min-height: 100vh; }
  body.render { place-items: start; }

  .stage {
    position: relative; overflow: hidden; width: 1080px; height: 1920px;
    background: var(--paper); color: var(--ink); font-family: var(--text);
    transform-origin: center; -webkit-font-smoothing: antialiased;
  }
  .render .stage { transform: none !important; }

  .name { position: absolute; left: var(--m); top: 250px; font-family: var(--serif); font-weight: 400; font-size: 212px; line-height: .86; letter-spacing: -.025em; }
  .mask { display: block; overflow: hidden; padding-bottom: .06em; margin-bottom: -.06em; }
  .line { display: block; }
  .when { position: absolute; right: var(--m); top: 282px; text-align: right; font-weight: 600; font-size: 34px; line-height: 1.2; color: var(--red); }

  .photo { position: absolute; left: var(--m); right: var(--m); top: 666px; height: 520px; overflow: hidden; }
  .photo img { display: block; width: 100%; height: 100%; object-fit: cover; }

  .menu { position: absolute; left: var(--m); right: var(--m); top: 1222px; font-size: 32px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .menu .row { display: flex; justify-content: space-between; align-items: baseline; gap: 32px; padding: 15px 0; border-bottom: 1px solid var(--rule); }
  .menu .row:first-child { border-top: 1px solid var(--ink); }
  .menu .k { color: var(--muted); }
  .menu .v { text-align: right; }
  .menu .v.strong { font-family: var(--serif); font-size: 46px; line-height: 1; color: var(--ink); }

  canvas.grain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: multiply; opacity: .06; }

  .guides { position: absolute; inset: 0; pointer-events: none; display: none; }
  .show-guides .guides { display: block; }
  .guides i { position: absolute; left: 0; right: 0; background: rgba(255,0,80,.18); }
  .guides i.top { top: 0; height: 250px; } .guides i.bottom { bottom: 0; height: 340px; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <h1 class="name">
    <span class="mask"><span class="line">Youmi</span></span>
    <span class="mask"><span class="line">Wings</span></span>
  </h1>
  <p class="when">Chaque<br>vendredi</p>

  <div class="photo"><img src="assets/plat.jpg" alt="Barquette de wings laqués, bananes pesées, salade de chou et sauce"></div>

  <div class="menu">
    <div class="row"><span class="k">Wings</span><span class="v strong">dès 750 gourdes</span></div>
    <div class="row"><span class="k">Spécial bière</span><span class="v strong">5 pour 1&nbsp;000 gourdes</span></div>
    <div class="row"><span class="k">Delmas 75, Siloe M</span><span class="v">Livraison disponible</span></div>
    <div class="row"><span class="k">Téléphone</span><span class="v">3179 3416 / 4943 2244</span></div>
  </div>

  <canvas class="grain" id="grain" aria-hidden="true"></canvas>
  <div class="guides"><i class="top"></i><i class="bottom"></i></div>
</div>

<script>
window.__config = { width: 1080, height: 1920, fps: 30, duration: 1, still: 0, fonts: ["Gloock", "Hanken Grotesk"] };
</script>
<script src="engine.js"></script>
</body>
</html>
