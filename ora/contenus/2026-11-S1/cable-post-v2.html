<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>ORA — câble USB-C 90°, post v2</title>
<link rel="stylesheet" href="../../templates/ora.css">
<style>
  /* Instagram 1080 × 1350, photo maison détourée. Le câble sort par le bord gauche. */
  .canvas { --W: 1080; --H: 1350; }
  .flaque { background: radial-gradient(ellipse 75% 38% at 55% 50%, rgba(250,250,250,.11) 0%, rgba(250,250,250,.03) 50%, transparent 78%); }
  .haut { position: absolute; left: var(--marge); right: var(--marge); top: var(--marge); }
  .haut .label { margin-bottom: 24px; }
  #coude { position: absolute; left: -120px; top: 560px; width: 1000px; }
  .bas { position: absolute; left: var(--marge); bottom: var(--marge); }
</style>
</head>
<body>
<div class="canvas" id="canvas">
  <div class="flaque"></div>
  <div class="haut">
    <div class="label">USB-C</div>
    <h1 class="titre">Coudé à 90°.</h1>
  </div>
  <img id="coude" class="produit-vrai" src="../../produits/cable-usbc-90/cable-usbc-90_coude_reel.png" alt="Câble USB-C, embout coudé à 90°">
  <div class="bas">
    <p class="sous">100 W · 1 mètre · USB-C des deux côtés</p>
    <p class="cta">Disponible.</p>
  </div>
  <img class="logo" src="../../logo/svg/ORA_logo_horizontal_cuivre-sur-noir.svg" alt="ORA">
</div>
<script>
  window.ORA_READY = false;
  coude.decode().finally(() => { window.ORA_READY = true; });
</script>
</body>
</html>
